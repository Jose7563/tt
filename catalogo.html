<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daly la cubana - Catálogo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <!-- Enlace a tu nuevo archivo CSS -->
    <link rel="stylesheet" href="estilos/style_catagolo.css">
</head>
<body class="min-h-screen flex flex-col relative">

    <!-- Navegación -->
    <nav class="w-full fixed top-0 px-8 py-6 flex justify-between items-center z-50 text-[10px] sm:text-xs font-bold tracking-[0.2em] uppercase text-pink-600">
        <div class="bg-white/80 px-4 py-1 rounded-full shadow-sm">
            <span class="text-pink-600">Daly la cubana </span>
        </div>
        
        <div class="hidden md:flex space-x-8 text-gray-800">
            <a href="index.html" class="hover:text-pink-600 transition"><span class="text-gray-400">01</span> HOME</a>
            <a href="#" class="border-b-2 border-pink-500 pb-1 text-pink-600"><span class="text-pink-300">02</span> CATÁLOGO</a>
            <a href="#" class="hover:text-pink-600 transition"><span class="text-gray-400">03</span> EN VIVO</a>
            <a href="#" class="hover:text-pink-600 transition"><span class="text-gray-400">04</span> SPONSORS</a>
        </div>

        <div class="bg-white/80 px-4 py-1 rounded-full shadow-sm flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-gray-400"></div>
            <img src="https://flagcdn.com/w20/cu.png" alt="Bandera de Cuba" class="w-9 h-auto ml-1 rounded-sm shadow-sm">
        </div>
    </nav>

    <!-- Título de fondo -->
    <div class="absolute left-8 lg:left-16 top-32 z-0 pointer-events-none opacity-90">
        <p class="text-xs font-bold tracking-widest text-gray-500 mb-2">01 LO QUE VIO / PUNTUÓ</p>
        <h2 class="serif-font text-4xl mb-4 text-gray-800">Catálogo</h2>
        <h1 class="brush-font text-7xl md:text-9xl leading-[0.8] tracking-tight transform -rotate-2">
            <span class="text-[#0f172a] block">Daly </span>
            <span class="text-[#e11d48] block">la cubana </span>
        </h1>
    </div>

    <!-- Contenido Principal -->
    <!-- Contenido Principal -->
    <main class="relative z-10 w-full flex flex-col items-center pt-32 pb-20 px-4">
        
        <!-- Buscador y Filtros -->
        <div class="w-full max-w-2xl flex flex-col items-center mb-10 bg-white/40 backdrop-blur-sm p-6 rounded-2xl shadow-sm border border-white/50">
            <h3 class="serif-font text-2xl font-bold tracking-widest mb-4 text-gray-900">Videos Daly la cubana</h3>
            
            <!-- Buscador -->
            <div class="w-full relative mb-4">
                <input type="text" id="search-input" placeholder="Buscar por título" class="w-full py-2 px-10 rounded-full border border-gray-300 bg-white/90 text-sm focus:outline-none focus:border-pink-400 shadow-inner">
                <svg class="w-4 h-4 absolute left-4 top-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                
                <button id="clear-search-btn" class="hidden absolute right-3 top-2.5 w-5 h-5 flex items-center justify-center bg-purple-100 text-purple-500 hover:bg-purple-200 rounded-full transition-colors cursor-pointer z-10">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            
            </div>

            <!-- Botones Categorías -->
            <div class="flex flex-wrap justify-center gap-2 mb-4 w-full" id="filter-buttons">
                <button data-filter="todo" class="filter-btn bg-purple-500 text-white px-4 py-1 rounded-full text-xs font-bold tracking-wider transition">TODO</button>
                <button data-filter="video" class="filter-btn bg-white/70 hover:bg-white text-gray-700 px-4 py-1 rounded-full text-xs font-bold tracking-wider transition">VIDEOS</button>
                <button data-filter="short" class="filter-btn bg-white/70 hover:bg-white text-gray-700 px-4 py-1 rounded-full text-xs font-bold tracking-wider transition">SHORTS</button>
                <button data-filter="tiktok" class="filter-btn bg-white/70 hover:bg-white text-gray-700 px-4 py-1 rounded-full text-xs font-bold tracking-wider transition">TIK TOK</button>
            </div> 
           

            <!-- Botones Ordenar (Visual) -->
            <div class="flex flex-wrap items-center justify-center gap-2 w-full text-[10px] font-bold tracking-widest uppercase">
                <span class="text-gray-500 mr-2">ORDENAR POR</span>
                <button class="bg-pink-500 text-white px-3 py-1 rounded-full">LO ÚLTIMO QUE VIO</button>
                <button class="bg-white/70 hover:bg-white text-gray-700 px-3 py-1 rounded-full transition">MEJOR PUNTUADAS</button>
                <button class="bg-white/70 hover:bg-white text-gray-700 px-3 py-1 rounded-full transition">A - Z</button>
            </div>
        </div>

        <!-- Mensaje de Búsqueda Vacía (Oculto por defecto) -->
        <div id="empty-message" class="hidden absolute top-[55%] left-1/2 transform -translate-x-1/2 text-center z-20 w-full">
            <p class="text-sm font-bold text-gray-800 tracking-widest bg-white/90 inline-block px-6 py-3 rounded-full shadow-md backdrop-blur-md">
                No encontramos nada con ese nombre. Probá con otro.
            </p>
        </div>

        <!-- Carrusel 3D -->
        <div class="relative w-full max-w-[1600px] h-[400px] mb-8 carousel-perspective flex justify-center" id="carousel-container">
            <!-- Las tarjetas se inyectarán aquí con JavaScript -->
        </div>

        <!-- Controles Carrusel -->
        <div id="carousel-controls" class="flex items-center justify-center gap-6 mb-8 transition-opacity duration-300">
            <button id="btn-prev" class="w-10 h-10 rounded-full bg-purple-500 text-white flex items-center justify-center hover:bg-purple-600 transition shadow-lg z-20">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <span class="text-xs font-bold tracking-widest text-gray-800" id="carousel-counter">1 DE X</span>
            <button id="btn-next" class="w-10 h-10 rounded-full bg-purple-500 text-white flex items-center justify-center hover:bg-purple-600 transition shadow-lg z-20">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>
        </div>

        <!-- Detalles Dinámicos Inferiores -->
        <div id="details-section" class="w-full max-w-2xl text-center bg-white/30 backdrop-blur-md p-8 rounded-3xl shadow-lg border border-white/60 transition-opacity duration-300">
            <p class="text-xs font-bold tracking-[0.3em] text-white uppercase mb-2" id="detail-meta"></p>
            <p class="serif-font text-xs font-bold text-gray-900 mb-2 tracking-wide" id="detail-title"></p>
        
            <p class="text-sm text-gray-800 font-medium mb-8 leading-relaxed px-4" id="detail-desc">
                ...
            </p>
            <a href="" id="detail-link" target="_blank" class="inline-block bg-white text-gray-900 font-bold tracking-widest text-xs px-8 py-3 rounded-md shadow-md hover:bg-gray-50 transition border border-gray-200 uppercase">
                VER FICHA
            </a>
        </div>

        <!--<div class="w-full max-w-[1600px] mt-24 mb-12" id="grid-wrapper">
            <h3 class="text-xs font-bold tracking-[0.3em] text-gray-500 mb-6 px-4 uppercase">Todo el Catálogo</h3>
            
            
            <div id="grid-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-7 gap-4 px-4">
               
            </div>
        </div>-->
        <div class="w-full max-w-[1600px] mt-24 mb-12" id="grid-wrapper">
            <h3 class="text-xs font-bold tracking-[0.3em] text-gray-500 mb-6 px-4 uppercase">Todo el Catálogo</h3>
            
            <!-- Contenedor donde JS inyectará las tarjetas -->
            <div id="grid-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-7 gap-4 px-4">
                <!-- Las tarjetas se generan dinámicamente aquí -->
            </div>

            <!-- Controles de Paginación del Grid -->
            <div id="grid-pagination-controls" class="flex items-center justify-center gap-4 mt-8 transition-opacity duration-300">
                <button id="btn-grid-prev" class="w-8 h-8 rounded-full bg-white/70 text-purple-600 flex items-center justify-center hover:bg-white transition shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <span class="text-xs font-bold tracking-widest text-gray-800" id="grid-page-counter">Página 1 de X</span>
                <button id="btn-grid-next" class="w-8 h-8 rounded-full bg-white/70 text-purple-600 flex items-center justify-center hover:bg-white transition shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>
        </div>
    </main>

    <!-- Enlace a tu nuevo archivo JavaScript -->
    <script src="js/catalogo.js"></script>
</body>
</html>
